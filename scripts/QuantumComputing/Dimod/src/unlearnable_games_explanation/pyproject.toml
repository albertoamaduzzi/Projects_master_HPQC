[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "skgame"
version = "0.1.0"
description = "Reproduction toolkit for 'Unlearnable Games and Satisficing Decisions' (arXiv:2312.12252)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7", "sympy>=1.12", "numba>=0.58"]

[project.optional-dependencies]
dwave = ["dimod>=0.12", "dwave-samplers>=1.2"]
qpu = ["dwave-system>=1.21"]
test = ["pytest>=7"]
nb = ["jupyter", "nbconvert", "ipykernel"]

[project.scripts]
skgame = "skgame.cli:main"

[tool.setuptools.packages.find]
include = ["skgame*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
